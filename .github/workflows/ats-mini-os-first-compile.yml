name: ATS Mini OS - First Compile (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    name: Compile-only / esp32s3-ospi
    env:
        PROFILE: esp32s3-ospi
        LABEL: OSPI-DE
        PSRAM: opi
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Free disk space for ESP32 platform packages
        run: |
          # ESP32 core installation unpacks libraries for several chip families.
          # Remove unrelated preinstalled SDKs from this ephemeral runner only.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.4.1

      - name: Restore ESP32 package download cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.arduino15/staging/packages
          # A unique key per attempt allows even a failed run to save completed
          # package downloads for the next manually started run.
          key: esp32-core-3.3.12-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            esp32-core-3.3.12-${{ runner.os }}-

      - name: Configure ESP32 package index
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

          install_log="$RUNNER_TEMP/esp32-core-install.log"
          installed=false

          # The runner can receive HTTP 504 responses while large Espressif
          # archives are being transferred. Reuse completed archives from the
          # Actions cache and retry transient failures with a longer backoff.
          for attempt in 1 2 3 4 5 6; do
            echo "Installing ESP32 core 3.3.12 (attempt $attempt/6)..."
            : > "$install_log"

            if arduino-cli core install esp32:esp32@3.3.12 2>&1 | tee "$install_log"; then
              installed=true
              break
            else
              status=$?
            fi

            if ! grep -Eqi 'HTTP response: 408|HTTP response: 429|HTTP response: 5[0-9][0-9]|Gateway Timeout|timed out|timeout|connection reset|unexpected EOF' "$install_log"; then
              echo "ESP32 core installation failed for a non-transient reason."
              exit "$status"
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "ESP32 core installation still fails after 6 attempts."
              exit "$status"
            fi

            delay=$((attempt * 45))
            echo "Temporary download/network failure. Retrying in ${delay}s..."
            sleep "$delay"
          done

          if [ "$installed" != true ]; then
            echo "ERROR: ESP32 core was not installed."
            exit 1
          fi

          arduino-cli core list

      - name: Save completed ESP32 package downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.arduino15/staging/packages
          key: esp32-core-3.3.12-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}


      - name: Install SI4735 tuner library
        env:
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: "true"
        run: arduino-cli lib install --git-url https://github.com/pu2clr/SI4735

      - name: Install LovyanGFX display library
        env:
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: "true"
        run: arduino-cli lib install --git-url https://github.com/lovyan03/LovyanGFX

      - name: Install ArduinoJson
        run: arduino-cli lib install "ArduinoJson"

      - name: Verify LovyanGFX installation
        run: |
          arduino-cli lib list
          LGFX_LIB="$HOME/Arduino/libraries/LovyanGFX"
          test -f "$LGFX_LIB/library.properties"
          test -f "$LGFX_LIB/src/LovyanGFX.hpp" || test -f "$LGFX_LIB/src/LovyanGFX.h"
          echo "Found LovyanGFX header at $LGFX_LIB/src"

      - name: Verify SI4735 header was installed
        run: |
          arduino-cli lib list
          SI4735_LIB="$HOME/Arduino/libraries/PU2CLR_SI4735"
          test -f "$SI4735_LIB/library.properties"
          test -f "$SI4735_LIB/src/SI4735.h"
          test -f "$SI4735_LIB/src/SI4735.cpp"
          echo "Found SI4735 library metadata, header, and implementation:"
          echo "$SI4735_LIB/library.properties"
          echo "$SI4735_LIB/src/SI4735.h"
          echo "$SI4735_LIB/src/SI4735.cpp"
          arduino-cli lib list "PU2CLR SI4735"

      - name: Verify ESP32-S3 target is available
        run: arduino-cli board details -b esp32:esp32:esp32s3

      - name: Stage third-party implementations in sketch source tree
        run: |
          # The current CLI report resolves LovyanGFX headers but omits LovyanGFX
          # from the compiled-library list, leaving its methods undefined at link time.
          # Stage upstream source files under the sketch's recursive src tree so
          # Arduino CLI compiles them as ordinary sketch sources.
          mkdir -p firmware/ats-mini-os/src/vendor/LovyanGFX
          cp -R "$HOME/Arduino/libraries/LovyanGFX/src/." firmware/ats-mini-os/src/vendor/LovyanGFX/
          cp "$HOME/Arduino/libraries/PU2CLR_SI4735/src/SI4735.cpp" firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          # Upstream getRdsDateTime() ORs the MJD bitfield into an uninitialized
          # integer. Initialize date fields in this staged copy to remove UB and
          # the compiler warning without changing the installed upstream library.
          sed -i 's/uint32_t mjd, day, month, year;/uint32_t mjd = 0, day = 0, month = 0, year = 0;/' firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          grep -F 'uint32_t mjd = 0, day = 0, month = 0, year = 0;' firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          test -f firmware/ats-mini-os/src/vendor/LovyanGFX/LovyanGFX.hpp
          test -f firmware/ats-mini-os/src/vendor/LovyanGFX/lgfx/v1/LGFX_Sprite.inl
          echo "Verified LGFX_Sprite.inl at firmware/ats-mini-os/src/vendor/LovyanGFX/lgfx/v1/LGFX_Sprite.inl"
          test -s firmware/ats-mini-os/src/vendor/SI4735Library.cpp
          echo "Staged LovyanGFX and SI4735 implementations into sketch src tree."

      - name: Compile ATS Mini OS scaffold
        run: |
          set -euo pipefail
          PROFILE="${{ env.PROFILE }}"
          BUILD_OUT="build/$PROFILE"
          mkdir -p "$BUILD_OUT"
          # The ESP32 core exports flash_args into the sketch-local build/ tree.
          # Remove any prior exported artifacts and force a clean compile so stale
          # flash_args cannot override the actual current profile's settings.
          rm -rf firmware/ats-mini-os/build
          arduino-cli compile \
            --clean \
            --output-dir "$BUILD_OUT" \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=${{ env.PSRAM }},CPUFreq=80,USBMode=hwcdc,FlashMode=qio,PartitionScheme=custom,DebugLevel=none" \
            --build-property "build.flash_mode=qio" \
            --build-property "build.flash_freq=80m" \
            --warnings all \
            --libraries "$HOME/Arduino/libraries" \
            --build-property "compiler.cpp.extra_flags=-Ifirmware/ats-mini-os/src/vendor/LovyanGFX -Ifirmware/ats-mini-os/src/vendor/LovyanGFX/lgfx -Ifirmware/ats-mini-os/src/vendor/LovyanGFX/lgfx/v1 -I$HOME/Arduino/libraries/PU2CLR_SI4735/src" \
            firmware/ats-mini-os 2>&1 | tee "build/$PROFILE-COMPILE-LOG.txt"
          # Require the generated arguments from this clean build to agree with
          # the OSPI/QSPI profile, rather than merely printing the intended value.
          FLASH_ARGS="$(find firmware/ats-mini-os/build "$BUILD_OUT" -type f -name flash_args -print -quit 2>/dev/null || true)"
          if [ -z "$FLASH_ARGS" ] || [ ! -s "$FLASH_ARGS" ]; then
            echo "ERROR: clean build did not generate flash_args." >&2
            exit 1
          fi
          echo "Generated flash_args: $FLASH_ARGS"
          cat "$FLASH_ARGS"
          grep -Eq -- '--flash-mode[[:space:]]+qio([[:space:]]|$)' "$FLASH_ARGS" || {
            echo "ERROR: generated flash_args does not declare qio; refusing to package this profile as valid." >&2
            exit 1
          }
          grep -Eq -- '--flash-size[[:space:]]+16MB([[:space:]]|$)' "$FLASH_ARGS" || {
            echo "ERROR: generated flash_args does not declare 16MB; refusing to package this profile as valid." >&2
            exit 1
          }

      - name: Validate app image against DBFM slot limits (read-only)
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ env.PROFILE }}"
          BUILD_OUT="build/$PROFILE"
          APP_BIN="$(find "$BUILD_OUT" firmware/ats-mini-os/build -type f -name 'ats-mini-os.ino.bin' -print -quit 2>/dev/null || true)"
          if [ -z "$APP_BIN" ] || [ ! -s "$APP_BIN" ]; then
            echo "ERROR: Arduino app image was not found after compile." >&2
            exit 1
          fi
          python - "$APP_BIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          image = path.read_bytes()
          size = len(image)
          slot_limit = int(3.5 * 1024 * 1024)

          if image[0:1] != b"\xE9":
              raise SystemExit(f"ERROR: {path} does not begin with ESP image magic 0xE9.")
          if size > slot_limit:
              raise SystemExit(
                  f"ERROR: app image is {size} bytes; DBFM slot limit is {slot_limit} bytes (3.5 MiB)."
              )

          project = image[0x50:0x50 + 32].split(b"\0", 1)[0] if len(image) >= 0x70 else b""
          version = image[0x30:0x30 + 32].split(b"\0", 1)[0] if len(image) >= 0x50 else b""
          atsm = image[288:292] == b"ATSM"

          print(f"App image: {path}")
          print(f"App image size: {size} / {slot_limit} bytes (DBFM 3.5 MiB slot limit)")
          print(f"ESP app descriptor project: {project.decode('utf-8', errors='replace') or '(not readable)'}")
          print(f"ESP app descriptor version: {version.decode('utf-8', errors='replace') or '(not readable)'}")
          print(f"ATSM marker at offset 288: {'present' if atsm else 'not present'}")
          print("Note: ATSM is reported for comparison; its absence alone is not treated as a DBFM rejection.")
          PY

      - name: Prepare firmware binary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="$(find "build/$PROFILE" -type f -name 'ats-mini-os.ino.bin' -print -quit)"
          if [ -z "$APP_BIN" ] || [ ! -s "$APP_BIN" ]; then
            echo "ERROR: validated application binary was not found." >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$APP_BIN" "release-artifacts/ATS-Mini-OS-$LABEL-Build-${{ github.run_number }}-${{ github.run_attempt }}.ino.bin"
          ls -lh release-artifacts/

      - name: Upload firmware binary only
        if: success() && hashFiles('release-artifacts/*.ino.bin') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ATS-Mini-OS-OSPI-DE-Firmware-BIN
          path: release-artifacts/*.ino.bin
          if-no-files-found: error
          retention-days: 14
