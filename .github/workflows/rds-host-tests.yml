name: RDS host regression tests

on:
  push:
    branches:
      - dev/first-build-preparation
    paths:
      - "firmware/ats-mini-os/src/rds/**"
      - "firmware/ats-mini-os/tests/**"
      - ".github/workflows/rds-host-tests.yml"
  workflow_dispatch:

jobs:
  rds-host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run RDS decoder vectors
        run: bash firmware/ats-mini-os/tests/run_host_tests.sh
